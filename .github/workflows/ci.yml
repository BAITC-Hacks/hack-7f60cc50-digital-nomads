name: ci
# Реальный датасет в репозиторий не кладётся — CI гоняет пайплайн на синтетике
# (tools/make_synthetic.py, та же схема) и все тесты, включая HTTP-сервер и LLM-цикл с фейковым API.
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tests/test_methodology.py
      - run: python tests/test_pipeline.py
      - run: python tests/test_assistant.py
      - run: python tests/test_serve.py
